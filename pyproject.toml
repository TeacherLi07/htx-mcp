[project]
name = "htx-official-api-mcp"
version = "0.7.2"
description = "Full-featured MCP server for HTX official REST APIs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx[socks]>=0.27.0,<1.0.0",
  "mcp>=2.0.0,<3.0.0",
]

[project.scripts]
htx-mcp = "htx_mcp.server:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.12.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
